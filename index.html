    <script>
      try {
        var supportedLanguages = ['zh-CN', 'zh-TW', 'en', 'de', 'ja', 'ko', 'es', 'fr'];
        var normalizeLanguage = function (language) {
          var value = String(language || '').replace('_', '-').toLowerCase();
          if (value === 'zh-tw' || value === 'zh-hk' || value === 'zh-mo' || value.indexOf('zh-hant') === 0) return 'zh-TW';
          if (value === 'zh-cn' || value === 'zh-sg' || value === 'zh' || value.indexOf('zh-hans') === 0) return 'zh-CN';
          var base = value.split('-')[0];
          return supportedLanguages.indexOf(base) >= 0 ? base : null;
        };
        var savedLanguage = normalizeLanguage(localStorage.getItem('invite-maker-language'));
        var systemLanguages = navigator.languages || [navigator.language];
        var initialLanguage = savedLanguage;
        for (var languageIndex = 0; !initialLanguage && languageIndex < systemLanguages.length; languageIndex += 1) {
          initialLanguage = normalizeLanguage(systemLanguages[languageIndex]);
        }
        document.documentElement.lang = initialLanguage || 'en';

        var savedTheme = localStorage.getItem('invite-maker-theme');
        var themePreference = savedTheme === 'light' || savedTheme === 'dark' || savedTheme === 'auto' ? savedTheme : 'auto';
        var resolvedTheme = themePreference === 'auto'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : themePreference;
        document.documentElement.setAttribute('data-mantine-color-scheme', resolvedTheme);
      } catch (error) {}
    </script>
